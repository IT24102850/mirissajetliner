<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
  <link rel="icon" type="image/x-icon" href="./images/gallery/favicon.ico" />
  <title>Mirissa Jetliner - Gallery</title>
  <meta name="description" content="Photo gallery — Mirissa Jetliner whale watching, dolphins, and on-board experiences. View vessel, passengers and tour highlights." />
  <link rel="canonical" href="https://mirissajetliner.com/gallery.html" />
  <meta property="og:title" content="Mirissa Jetliner - Gallery" />
  <meta property="og:description" content="Gallery of Mirissa Jetliner tours: whales, dolphins and our vessel. See highlights from recent trips." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mirissajetliner.com/gallery.html" />
  <meta property="og:image" content="https://mirissajetliner.com/public/images/gallery/a1.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ===== RESET & VARIABLES (mirror index) ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --abyss: #030d13;
      --deep: #072330;
      --mid: #0f3f52;
      --surface-teal: #1b7a8c;
      --dawn: #f3a35c;
      --dawn-soft: #ffd9a0;
      --foam: #f4faf8;
      --ink: #dff3f0;
      --mist: #8fb4bc;
      --line: rgba(223, 243, 240, 0.12);
      --card: rgba(244, 250, 248, 0.045);
      --card-hover: rgba(244, 250, 248, 0.08);
      --display: 'Fraunces', Georgia, serif;
      --body: 'Inter', -apple-system, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
      --shadow-glow: 0 20px 40px -12px rgba(0,0,0,0.7);
    }
    html { scroll-behavior: smooth; scroll-padding-top: 88px; }
    body {
      font-family: var(--body);
      background: var(--abyss);
      color: var(--ink);
      line-height: 1.6;
      overflow-x: hidden;
      background-image: url('images/whale303.jpg');
      background-size: cover;
      background-position: center 30%;
      background-attachment: fixed;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    ul { list-style: none; }
    :focus-visible {
      outline: 2px solid var(--dawn);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* ===== OVERLAY ===== */
    .body-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(3,13,19,.6) 0%, rgba(5,20,28,.85) 45%, var(--abyss) 100%);
      z-index: 0;
      pointer-events: none;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 6%;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      background: transparent;
      transition: background .4s ease, border-color .4s ease, padding .3s ease, box-shadow .3s ease;
    }
    .header.scrolled {
      background: rgba(3, 13, 19, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      padding: 12px 6%;
      box-shadow: 0 4px 30px rgba(0,0,0,0.4);
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo a { display: flex; align-items: center; gap: 10px; }
    .logo img { width: 28px; height: 28px; border-radius: 6px; box-shadow: 0 0 12px rgba(243,163,92,0.2); }
    .logo span {
      font-family: var(--display);
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--foam);
      text-shadow: 0 0 20px rgba(243,163,92,0.15);
    }
    .nav-menu { display: flex; align-items: center; gap: 36px; }
    .nav-menu a {
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--mist);
      position: relative;
      padding-bottom: 4px;
      transition: color .25s;
    }
    .nav-menu a::after {
      content: '';
      position: absolute;
      left: 0; bottom: 0;
      width: 0; height: 1.5px;
      background: var(--dawn);
      transition: width .3s ease;
    }
    .nav-menu a:hover { color: var(--foam); }
    .nav-menu a:hover::after { width: 100%; }
    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--foam);
      font-size: 26px;
      cursor: pointer;
      z-index: 1001;
      padding: 4px 8px;
    }

    /* ===== MAIN CONTENT ===== */
    .main-content {
      position: relative;
      z-index: 1;
      padding: 120px 6% 80px;
      max-width: 1280px;
      margin: 0 auto;
    }

    /* Hero */
    .page-hero {
      text-align: center;
      padding: 40px 0 50px;
    }
    .page-hero h1 {
      font-family: var(--display);
      font-size: clamp(40px, 6vw, 64px);
      font-weight: 500;
      color: var(--foam);
      letter-spacing: -0.01em;
      text-shadow: 0 4px 40px rgba(0,0,0,0.5);
    }
    .page-hero p {
      max-width: 55ch;
      margin: 18px auto 0;
      color: var(--mist);
      font-size: 17px;
    }
    .page-hero .eyebrow {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--dawn-soft);
      margin-bottom: 16px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
    .page-hero .eyebrow::before {
      content: '';
      width: 32px; height: 1.5px;
      background: var(--dawn);
      box-shadow: 0 0 10px rgba(243,163,92,0.5);
    }
    .page-hero .eyebrow::after {
      content: '';
      width: 32px; height: 1.5px;
      background: var(--dawn);
      box-shadow: 0 0 10px rgba(243,163,92,0.5);
    }

    /* Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .gallery-item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: all .3s ease;
      aspect-ratio: 4/3;
      box-shadow: var(--shadow-glow);
    }
    .gallery-item:hover {
      transform: translateY(-5px);
      background: var(--card-hover);
      border-color: rgba(223, 243, 240, 0.2);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s ease;
    }
    .gallery-item:hover img {
      transform: scale(1.05);
    }

    /* ===== LIGHTBOX ===== */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 13, 19, 0.92);
      backdrop-filter: blur(16px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox-content {
      position: relative;
      max-width: 90%;
      max-height: 85vh;
    }
    .lightbox-content img {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 12px;
      border: 1px solid var(--line);
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }
    .lightbox-close {
      position: absolute;
      top: -44px;
      right: 0;
      font-size: 32px;
      color: var(--mist);
      cursor: pointer;
      transition: color .3s;
      font-family: var(--mono);
    }
    .lightbox-close:hover {
      color: var(--dawn-soft);
    }

    /* ===== SOCIAL DOCK — premium, glossy ===== */
    .social-dock {
      position: fixed;
      bottom: 28px;
      right: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 850;
    }
    .social-dock a {
      width: 44px;
      height: 44px;
      background: rgba(7, 35, 48, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform .3s cubic-bezier(.34,1.56,.64,1), border-color .3s ease, background .3s ease, box-shadow .3s ease;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .social-dock a:hover {
      transform: translateY(-4px) scale(1.05);
      border-color: var(--dawn);
      background: rgba(15, 63, 82, 0.9);
      box-shadow: 0 8px 28px rgba(243,163,92,0.25);
    }
    .social-dock svg {
      width: 18px;
      height: 18px;
      stroke: var(--mist);
      fill: none;
      transition: stroke .3s ease, fill .3s ease;
    }
    .social-dock a[data-fill] svg { fill: var(--mist); stroke: none; }
    .social-dock a:hover svg { stroke: var(--dawn-soft); }
    .social-dock a:hover svg[data-fillicon] { fill: var(--dawn-soft); }
    .social-dock a:hover svg { fill: var(--dawn-soft); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .header { padding: 12px 5%; }
      .mobile-menu-btn { display: block; }
      .nav-menu {
        position: fixed;
        top: 0; right: 0;
        height: 100vh;
        width: 76%;
        max-width: 320px;
        background: rgba(3,13,19,0.97);
        backdrop-filter: blur(16px);
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 28px;
        padding: 0 40px;
        transform: translateX(100%);
        transition: transform .4s cubic-bezier(.25,.46,.45,.94);
        border-left: 1px solid var(--line);
        box-shadow: -8px 0 40px rgba(0,0,0,0.5);
      }
      .nav-menu.active { transform: translateX(0); }
      .main-content { padding: 100px 5% 50px; }
      .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
      .social-dock { bottom: 80px; right: 16px; }
      .social-dock a { width: 40px; height: 40px; }
      .lightbox { padding: 20px; }
      .lightbox-content { max-width: 95%; }
      .lightbox-close { top: -36px; font-size: 26px; }
    }
    @media (max-width: 480px) {
      .page-hero h1 { font-size: 32px; }
      .gallery-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<!-- ===== SCRIPTS ===== -->
<script>
  // Mobile menu
  const menuToggle = document.getElementById('menuToggle');
  const navMenu = document.getElementById('navMenu');
  if (menuToggle && navMenu) {
    menuToggle.addEventListener('click', () => navMenu.classList.toggle('active'));
    navMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => navMenu.classList.remove('active')));
  }

  // Header scroll effect
  const header = document.getElementById('siteHeader');
  const onScrollHeader = () => {
    if (header) header.classList.toggle('scrolled', window.scrollY > 40);
  };
  document.addEventListener('scroll', onScrollHeader, { passive: true });
  onScrollHeader();

  // Lightbox
  const galleryItems = document.querySelectorAll('.gallery-item');
  const lightbox = document.getElementById('lightbox');
  const lightboxImage = document.getElementById('lightboxImage');
  const lightboxClose = document.getElementById('lightboxClose');

  galleryItems.forEach(item => {
    item.addEventListener('click', () => {
      const full = item.getAttribute('data-full');
      if (full) {
        lightboxImage.src = full;
        lightboxImage.alt = item.querySelector('img')?.alt || 'Gallery image';
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      }
    });
  });

  function closeLightbox() {
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
  }

  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
  });
</script>
